name: Client CD

on:
  push:
    branches: [ main ]
    paths:
      - 'client-next/**'
      - '.github/workflows/deploy-client.yml'

jobs:
  deploy-client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SECRET_KEY }}
          port: 2222
          script: |
            #!/bin/bash
            set -euo pipefail

            # ========================================
            # 1. NVM mühitini yüklə
            # ========================================
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \
              . "$NVM_DIR/nvm.sh" || {
              echo "❌ nvm.sh tapılmadı: $NVM_DIR/nvm.sh"
              exit 1
            }

            # ========================================
            # 2. Node 20 versiyasını aktiv et
            # ========================================
            echo "🔄 Node 20 aktivləşdirilir..."
            nvm use 20 || {
              echo "⚠️ Node 20 tapılmadı, default Node istifadə olunur"
              nvm use default
            }

            # ========================================
            # 3. pnpm PATH-ını əlavə et
            # ========================================
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"

            # ========================================
            # 4. Versiyaları yoxla
            # ========================================
            echo "🔎 Quraşdırılmış versiyalar:"
            node -v || { echo "❌ node tapılmadı"; exit 1; }
            pnpm -v || { echo "❌ pnpm tapılmadı"; exit 1; }
            pm2 -v || { echo "❌ pm2 tapılmadı"; exit 1; }

            # ========================================
            # 5. Proyekt konfiqurasiyası
            # ========================================
            APP_NAME="narminhasanli-client"
            # Monorepo: bir git checkout, iki alt-qovluq (server/, client-next/).
            # REPO_DIR-i öz serverindəki real yolla əvəz et.
            REPO_DIR="/var/www/narminhasanli"
            APP_DIR="$REPO_DIR/client-next"
            export NODE_ENV=production
            export PORT=3103

            echo "➡️ Repo qovluğuna keçilir: $REPO_DIR"
            cd "$REPO_DIR" || { echo "❌ Qovluq tapılmadı: $REPO_DIR"; exit 1; }

            # ========================================
            # 6. Git repository-ni yenilə (monorepo kökündə)
            # ========================================
            echo "📥 Repository yenilənir..."
            git fetch --all --prune

            if ! git merge --ff-only origin/main; then
              echo "⚠️ Fast-forward merge mümkün olmadı, hard reset edilir..."
              git reset --hard origin/main
            fi

            echo "✅ Repository yeniləndi: $(git rev-parse --short HEAD)"

            echo "➡️ Client qovluğuna keçilir: $APP_DIR"
            cd "$APP_DIR" || { echo "❌ Qovluq tapılmadı: $APP_DIR"; exit 1; }

            # ========================================
            # 7. Dependencies quraşdır
            # ========================================
            echo "📦 Dependencies quraşdırılır..."
            pnpm install --no-frozen-lockfile

            # ========================================
            # 8. Next.js Build
            # ========================================
            echo "🏗️ Next.js build edilir..."
            pnpm run build

            # ========================================
            # 9. PM2 ilə restart et
            # ========================================
            echo "🚀 PM2 ilə aplikasiya restart edilir..."

            if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
              pm2 restart "$APP_NAME" --update-env
            else
              echo "🆕 Yeni aplikasiya başladılır..."
              pm2 start "pnpm start" --name "$APP_NAME"
            fi

            pm2 save --force

            echo "✅ Next.js client deploy uğurla tamamlandı (port $PORT)."
